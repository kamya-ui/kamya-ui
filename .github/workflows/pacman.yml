name: generate pacman animation

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # This action generates the Pacman maze based on your commits
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: kamya-ui
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # This customizes the "Snake" into a "Pacman" style maze
          # Format: #background #pacman #ghost1 #ghost2 #ghost3 #ghost4
          # We use Pastel Pink, Mint, Lavender, and Peach
          snake_color: "#FFD1DC" 
          dots: "#2D333B,#B2E2F2,#C1E1C1,#E0BBE4,#FFCC99"

      # This step saves the generated file to a branch called 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
