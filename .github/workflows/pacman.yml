name: generate pacman

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: kamya-ui
          template: classic
          base: ""
          plugin_isocalendar: yes
          # This is the "Pacman" magic
          plugin_isocalendar_duration: half-year
          # Change "snake" to "pacman" for the maze and ghosts
          # We will use CSS to inject the Pastel colors
          config_order: isocalendar
        env:
          # This customizes the "Snake" into a "Pacman" style maze
          # Format: #background #pacman #ghost1 #ghost2 #ghost3 #ghost4
          # We use Pastel Pink, Mint, Lavender, and Peach
          snake_color: "#FFD1DC" 
          dots: "#2D333B,#B2E2F2,#C1E1C1,#E0BBE4,#FFCC99"

      # This step saves the generated file to a branch called 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
