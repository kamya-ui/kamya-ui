name: Generate Pac-Man Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # runs twice a day
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Pac-Man style
        uses: Platane/snk@v3
        with:
          github_user_name: kamya-ui
          outputs: |
            dist/pacman.svg?theme=pacman
            dist/pacman-dark.svg?theme=pacman&palette=github-dark

      - name: Publish output
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
