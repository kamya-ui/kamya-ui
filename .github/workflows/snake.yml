name: generate animation

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *" 
  
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kamya-ui
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # SNAKE: Bright Pastel Pink for visibility
          snake_color: "#FFB7CE"
          # DARK MODE PALETTE:
          # 1st color is the "empty" box. We use a deep charcoal/navy so it's visible but dark.
          # The rest are vibrant pastels that glow against dark backgrounds.
          dots: "#2D333B,#79ADD2,#B8E1DD,#FBC7D4,#E1CEFF"

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
