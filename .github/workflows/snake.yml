name: generate animation

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *" 
  
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kamya-ui
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # SNAKE COLOR: Pastel Pink (#FFD1DC)
          # DOTS: [Empty/Low, Medium-Low, Medium, Medium-High, High Activity]
          # I've changed the first color from white to Mint (#E0F2F1) to "fill" the board.
          snake_color: "#FFD1DC"
          dots: "#E0F2F1,#B2E2F2,#C1E1C1,#FFCC99,#E0BBE4"

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
